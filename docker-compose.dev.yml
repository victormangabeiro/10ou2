version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: 10ou2_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: 10ou2_db
      MARIADB_USER: pelada_user
      MARIADB_PASSWORD: pelada_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: 10ou2_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mariadb_data:
  redis_data:
